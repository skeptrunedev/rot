[package]
name = "rot-cli"
description = "Command line interface for the rot project"
license = "MIT"
repository = "github.com/skeptrunedev/rot"
readme = "../README.md"
keywords = ["rot", "cli", "command line interface"]
categories = ["development-tools::build-tools"]
version = "0.1.0"
edition = "2021"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
unwrap_used = "deny"

[dependencies]
clap = { version = "4.5.23", features = ["derive", "default"] }
console = "0.15.10"
dialoguer = "0.11.0"
rot-common = { path = "../common" }
serde = "1.0.217"
serde_json = "1.0.134"
